<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>AgentNova · Living Remnant</title>
<style>
  html, body { margin: 0; height: 100%; background: #050505; overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; }
  #tag {
    position: fixed; left: 12px; bottom: 10px; color: #8a8a8a;
    font-family: "Space Mono", monospace; font-size: 11px; letter-spacing: 0.18em;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="tag">AGENTNOVA</div>
<script src="js/config.js?v=1"></script>
<script src="js/read.js?v=1"></script>
<script>
(function () {
  var N = window.NOVA, R = window.NovaRead;
  var id = Number(new URLSearchParams(location.search).get("id") || 0);
  var cv = document.getElementById("c"), ctx = cv.getContext("2d");
  var W = 0, H = 0;
  function resize() { W = cv.width = innerWidth; H = cv.height = innerHeight; }
  addEventListener("resize", resize); resize();

  function drawUnrevealed() {
    var cx = W / 2, cy = H / 2, r = Math.min(W, H) * 0.19;
    ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, W, H);
    ctx.strokeStyle = "#f5f5f5"; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = "#f5f5f5";
    ctx.beginPath(); ctx.arc(cx, cy, 5, 0, Math.PI * 2); ctx.fill();
    ctx.font = "600 " + Math.max(15, Math.min(W, H) * 0.045) + "px monospace";
    ctx.textAlign = "center"; ctx.fillText("U N R E V E A L E D", cx, cy + r + 52);
  }

  function start(seedHex, cls) {
    document.getElementById("tag").textContent = "AGENTNOVA #" + id + " · " + ["EMBER", "NOVA", "SUPERNOVA"][cls];
    var s = BigInt(seedHex);
    var state = Number(s % 2147483647n) || 12345;
    function rnd() { state = (state * 16807) % 2147483647; return (state - 1) / 2147483646; }
    function gauss() { return (rnd() + rnd() + rnd() - 1.5) / 1.5; }
    var counts = [520, 1150, 2100];
    var speeds = [0.5, 0.8, 1.15];
    var blobs = [];
    for (var b = 0; b < 7; b++) blobs.push([(rnd() - 0.5) * 0.9, (rnd() - 0.5) * 0.7, (rnd() - 0.5) * 0.4]);
    var parts = [];
    var n = counts[cls];
    for (var i = 0; i < n; i++) {
      var bl = blobs[Math.floor(rnd() * blobs.length)];
      parts.push({
        x: bl[0] + gauss() * 0.34, y: (bl[1] + gauss() * 0.34) * 0.74, z: bl[2] + gauss() * 0.3,
        v: 0.35 + rnd() * 0.65, sz: 0.6 + rnd() * 1.7
      });
    }
    var beamTilt = rnd() * Math.PI;
    var t0 = performance.now();
    (function frame(now) {
      requestAnimationFrame(frame);
      var t = (now - t0) / 1000;
      var cx = W / 2, cy = H / 2, R0 = Math.min(W, H) * 0.46;
      ctx.fillStyle = "#050505"; ctx.fillRect(0, 0, W, H);
      var rot = t * 0.05 * speeds[cls];
      var cosr = Math.cos(rot), sinr = Math.sin(rot);
      // pulsar beams
      ctx.save(); ctx.translate(cx, cy); ctx.rotate(beamTilt + t * 0.55 * speeds[cls]);
      var grd = ctx.createLinearGradient(0, -R0, 0, R0);
      grd.addColorStop(0, "rgba(255,255,255,0)");
      grd.addColorStop(0.5, "rgba(255,255,255,0.10)");
      grd.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = grd;
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-R0 * 0.16, -R0); ctx.lineTo(R0 * 0.16, -R0); ctx.closePath(); ctx.fill();
      ctx.beginPath();
      ctx.moveTo(0, 0); ctx.lineTo(-R0 * 0.16, R0); ctx.lineTo(R0 * 0.16, R0); ctx.closePath(); ctx.fill();
      ctx.restore();
      // remnant cloud
      for (var j = 0; j < parts.length; j++) {
        var p = parts[j];
        var x = p.x * cosr - p.z * sinr, z = p.x * sinr + p.z * cosr;
        var sc = 1 / (1 + z * 0.35);
        var px = cx + x * R0 * sc, py = cy + p.y * R0 * sc;
        var a = Math.max(0.05, Math.min(1, p.v * sc));
        ctx.fillStyle = "rgba(245,245,245," + a.toFixed(3) + ")";
        ctx.fillRect(px, py, p.sz * sc, p.sz * sc);
      }
      // neutron star
      var glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, R0 * 0.22);
      glow.addColorStop(0, "rgba(255,255,255,0.85)");
      glow.addColorStop(0.4, "rgba(255,255,255,0.18)");
      glow.addColorStop(1, "rgba(255,255,255,0)");
      ctx.fillStyle = glow;
      ctx.beginPath(); ctx.arc(cx, cy, R0 * 0.22, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = "#fff";
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(2.4, R0 * 0.016) * (1 + Math.sin(t * 2.2) * 0.07), 0, Math.PI * 2); ctx.fill();
    })(t0);
  }

  if (!id) { drawUnrevealed(); return; }
  var seedP = R.call(N.nft, N.sel.seedOf + R.padNum(id));
  var clsP = R.call(N.nft, N.sel.rarityClassOf + R.padNum(id));
  Promise.all([seedP, clsP]).then(function (res) {
    start(res[0], Number(BigInt(res[1])));
  }).catch(drawUnrevealed);
})();
</script>
</body>
</html>
